<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subscribe on YouTube</title>
<meta name="theme-color" content="#0f0f0f">
<style>
  :root { --red:#ff0033; --bg:#0f0f0f; --card:#1a1a1a; --text:#f1f1f1; --muted:#aaa; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 0%, #2a0a12 0%, var(--bg) 60%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px;
  }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:24px; padding:32px 24px; text-align:center;
          box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .logo { width:72px; height:50px; margin:0 auto 20px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p  { margin:0 0 24px; color:var(--muted); font-size:15px; line-height:1.5; }
  .btn { display:block; width:100%; padding:16px; border:0; border-radius:14px; background:var(--red); color:#fff;
         font-size:17px; font-weight:700; text-decoration:none; cursor:pointer; }
  .btn:active { transform:scale(.98); }
  .alt { display:block; margin-top:16px; color:var(--muted); font-size:14px; text-decoration:underline; }
  .tip { display:none; text-align:left; background:#2a2a2a; border-radius:14px; padding:14px 16px; margin-bottom:20px;
         font-size:14px; line-height:1.5; color:#ddd; }
  .tip b { color:#fff; }
  .tip.show { display:block; }
</style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 72 50" aria-hidden="true">
      <rect width="72" height="50" rx="14" fill="#ff0033"/>
      <path d="M29 14l18 11-18 11z" fill="#fff"/>
    </svg>
    <h1 id="name">Opening YouTube…</h1>
    <p id="tagline">Tap the button to open the channel in the YouTube app.</p>

    <div class="tip" id="tip"></div>

    <a class="btn" id="open" href="#">Open in YouTube App</a>
    <a class="alt" id="web" href="#">Continue in browser instead</a>
  </main>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  handle:      "Wiki_Playz",   // your @handle, without the @
  channelId:   "",                    // optional: "UCxxxxxxxxxxxxxxxxxxxxxx" (more reliable on iOS)
  channelName: "Wiki Playz",
  tagline:     "Tap below to open my channel in the YouTube app and hit Subscribe 🔔",
};
/* ==================================== */

const ua        = navigator.userAgent || "";
const isAndroid = /Android/i.test(ua);
const isIOS     = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const inApp     = /Instagram|FBAN|FBAV|FB_IAB|Facebook/i.test(ua);

const path   = CONFIG.channelId ? `channel/${CONFIG.channelId}` : `@${CONFIG.handle}`;
const webUrl = `https://www.youtube.com/${path}?sub_confirmation=1`;   // web fallback shows the Subscribe prompt
const iosUrl = `youtube://www.youtube.com/${path}`;
const androidUrl =
  `intent://www.youtube.com/${path}#Intent;scheme=https;package=com.google.android.youtube;` +
  `S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;

document.getElementById("name").textContent    = CONFIG.channelName;
document.getElementById("tagline").textContent = CONFIG.tagline;
document.getElementById("web").href = webUrl;

// Instagram's in-app browser often blocks app links, so tell people how to escape it.
if (inApp) {
  const tip = document.getElementById("tip");
  tip.innerHTML = isIOS
    ? "💡 <b>Best way:</b> tap the <b>⋯</b> (top right) → <b>Open in Safari</b>, then tap the button. It will jump straight into the YouTube app."
    : "💡 <b>Best way:</b> tap the <b>⋮</b> (top right) → <b>Open in Chrome / external browser</b>, then tap the button.";
  tip.classList.add("show");
}

function openApp() {
  if (isAndroid) {
    window.location.href = androidUrl;            // has built-in browser fallback
  } else if (isIOS) {
    window.location.href = iosUrl;
    setTimeout(() => { if (!document.hidden) window.location.href = webUrl; }, 1800);
  } else {
    window.location.href = webUrl;                // desktop
  }
}

document.getElementById("open").addEventListener("click", (e) => { e.preventDefault(); openApp(); });

// Try automatically on load (works on many Android setups; iOS usually needs the tap).
if (isAndroid || (!isIOS && !isAndroid)) {
  window.addEventListener("load", () => setTimeout(openApp, 400));
}
</script>
</body>
</html>
